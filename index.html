<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>日常记录</title>
    <link rel="stylesheet" href="./styles.css?v=20260819-2" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="date-line" id="todayLabel">今天</p>
          <h1>日常记录</h1>
        </div>
        <button class="icon-button logout-button" id="logoutBtn" type="button" aria-label="退出登录" title="退出登录">
          <span aria-hidden="true">↗</span>
        </button>
      </header>

      <section class="today-panel" aria-label="今天记录">
        <div class="today-item water-today">
          <span class="today-kicker">今日喝水</span>
          <div class="today-value"><strong id="todayWaterCount">0</strong><span>杯</span></div>
          <div class="stepper" aria-label="调整今天喝水杯数">
            <button id="todayWaterMinusBtn" type="button" aria-label="减少一杯">−</button>
            <button id="todayWaterPlusBtn" type="button" aria-label="增加一杯">＋</button>
          </div>
        </div>
        <button class="today-item workout-today" id="todayWorkoutBtn" type="button">
          <span class="today-kicker">今日健身</span>
          <strong id="todayWorkoutStatus">未完成</strong>
          <span class="workout-mark" aria-hidden="true">✓</span>
        </button>
      </section>

      <section class="view-toolbar" aria-label="时间视图">
        <div class="view-tabs" role="tablist">
          <button class="active" type="button" data-view="month" role="tab">月度</button>
          <button type="button" data-view="year" role="tab">年度</button>
        </div>
        <button class="today-link" id="goTodayBtn" type="button">回到今天</button>
      </section>

      <section class="period-navigator">
        <button class="icon-button" id="prevPeriodBtn" type="button" aria-label="上一时间段">‹</button>
        <button class="period-picker" id="periodPickerBtn" type="button" aria-label="选择年月">
          <strong id="periodTitle">--</strong>
          <span>⌄</span>
        </button>
        <button class="icon-button" id="nextPeriodBtn" type="button" aria-label="下一时间段">›</button>
        <input id="monthPicker" type="month" aria-label="选择月份" />
      </section>

      <section class="module water-module">
        <header class="module-header">
          <div>
            <p class="module-index">01 / WATER</p>
            <h2>喝水趋势</h2>
          </div>
          <div class="module-stat">
            <strong id="waterPrimaryStat">0</strong>
            <span id="waterPrimaryLabel">本月总杯数</span>
          </div>
        </header>
        <div class="summary-row" id="waterSummary"></div>
        <div class="chart-frame">
          <canvas id="waterChart" width="720" height="320"></canvas>
          <p class="empty-note" id="waterEmpty">这个时间段还没有喝水记录</p>
        </div>
        <div class="calendar-block" id="waterCalendarBlock">
          <div class="weekday-row" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div class="day-grid" id="waterDays"></div>
        </div>
        <button class="target-link" id="targetBtn" type="button">参考目标：每天 <b id="waterTargetText">8</b> 杯 · 修改</button>
      </section>

      <section class="module workout-module">
        <header class="module-header">
          <div>
            <p class="module-index">02 / TRAINING</p>
            <h2>健身记录</h2>
          </div>
          <div class="module-stat">
            <strong id="workoutPrimaryStat">0</strong>
            <span id="workoutPrimaryLabel">本月完成</span>
          </div>
        </header>
        <div class="workout-metrics">
          <div><span>当前连续</span><strong id="currentStreak">0 天</strong></div>
          <div><span>今年累计</span><strong id="yearWorkoutDays">0 天</strong></div>
          <div><span>最长连续</span><strong id="longestStreak">0 天</strong></div>
        </div>
        <div class="calendar-block">
          <div class="weekday-row" id="workoutWeekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div class="workout-grid" id="workoutGrid"></div>
        </div>
        <p class="module-foot" id="workoutSummary"></p>
      </section>
    </main>

    <dialog class="edit-dialog" id="editDialog">
      <form method="dialog" class="edit-card">
        <div class="dialog-head"><p>编辑记录</p><h2 id="editDateTitle">--</h2></div>
        <label for="editWaterInput">当天喝水</label>
        <div class="number-control"><input id="editWaterInput" type="number" min="0" max="40" step="1" value="0" /><span>杯</span></div>
        <label class="check-row"><input id="editWorkoutInput" type="checkbox" /><span>当天完成健身</span></label>
        <p class="dialog-note" id="editNote"></p>
        <menu><button class="ghost-button" value="cancel" type="submit">取消</button><button class="save-button" id="saveEditBtn" value="default" type="button">保存记录</button></menu>
      </form>
    </dialog>

    <dialog class="edit-dialog" id="targetDialog">
      <form method="dialog" class="edit-card compact-dialog">
        <div class="dialog-head"><p>图表参考线</p><h2>每天喝水目标</h2></div>
        <p class="dialog-copy">只用于观察趋势和达标天数，不会限制你的记录。</p>
        <div class="number-control"><input id="targetInput" type="number" min="1" max="30" step="1" value="8" /><span>杯</span></div>
        <menu><button class="ghost-button" value="cancel" type="submit">取消</button><button class="save-button" id="saveTargetBtn" value="default" type="button">确认</button></menu>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js?v=20260818"></script>
    <script src="./app.js?v=20260819-2"></script>
  </body>
</html>
