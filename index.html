<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101828" />
    <title>个人管理</title>
    <link rel="stylesheet" href="./styles.css?v=20260818" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">PERSONAL LOG</p>
          <h1>今日状态</h1>
          <span id="todayLabel">--</span>
        </div>
        <button class="text-button" id="logoutBtn" type="button">退出</button>
      </header>

      <section class="quick-grid">
        <article class="quick-card water">
          <span>今日喝水</span>
          <strong><b id="waterCount">0</b> 杯</strong>
          <div class="stepper">
            <button id="waterMinusBtn" type="button" aria-label="少一杯">-</button>
            <button id="waterPlusBtn" type="button" aria-label="多一杯">+</button>
          </div>
        </article>

        <article class="quick-card workout">
          <span>今日健身</span>
          <strong id="workoutStatus">未完成</strong>
          <button class="done-button" id="workoutToggleBtn" type="button">完成</button>
        </article>
      </section>

      <section class="target-panel">
        <div>
          <span>喝水目标</span>
          <strong><b id="waterTargetText">8</b> 杯 / 天</strong>
        </div>
        <input id="waterTargetInput" type="range" min="1" max="20" step="1" value="8" />
        <p id="waterNote">今天还差 8 杯。</p>
      </section>

      <section class="metric-grid">
        <article>
          <span>连续健身</span>
          <strong id="currentStreak">0 天</strong>
        </article>
        <article>
          <span>今年健身</span>
          <strong id="yearWorkoutDays">0 天</strong>
        </article>
        <article>
          <span>本月喝水均值</span>
          <strong id="monthWaterAvg">0 杯</strong>
        </article>
      </section>

      <section class="module-card water-module">
        <div class="section-head">
          <div>
            <h2>本月喝水</h2>
            <span id="waterMonthSummary">--</span>
          </div>
        </div>
        <div class="chart-frame">
          <canvas id="waterChart" width="640" height="300"></canvas>
        </div>
      </section>

      <section class="module-card workout-module">
        <div class="section-head">
          <div>
            <h2>本月健身</h2>
            <span id="workoutMonthSummary">--</span>
          </div>
        </div>
        <div class="workout-calendar" id="workoutCalendar"></div>
      </section>

      <section class="recent-section">
        <div class="section-head">
          <div>
            <h2>最近记录</h2>
            <span>最近 14 天</span>
          </div>
        </div>
        <ol class="day-list" id="dayList"></ol>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js?v=20260818"></script>
    <script src="./app.js?v=20260818"></script>
  </body>
</html>
